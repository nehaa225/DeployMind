version: '3.8'

services:
  deploymind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deploymind-agent
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./deploymind.db
      - LLM_MODEL=llama-3.3-70b-versatile
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - deploymind_data:/app/data
    restart: unless-stopped

volumes:
  deploymind_data:
